spring:
  cloud:
    gateway:
      routes:
        - id: product-service
          uri: http://product-service:8093/
          predicates:
            - Path=/product/**
          filters:
          - AuthenticationFilter


        - id: order-service
          uri: http://order-service:8092/
          predicates:
            - Path=/order/**
        #         filters:
        #           - AuthenticationFilter

        - id: inventory-service
          uri: http://inventory-service:8094/
          predicates:
            - Path=/inventory/**

        - id: auth-service
          uri: http://auth-service:8088/
          predicates:
            - Path=/auth/**
    discovery:
      enabled: true

  application:
    name: WIREME-GATEWAY

#eureka:
#  client:
#    serviceUrl:
#      defaultZone: http://eureka:password@discovery-server:8761/eureka

management:
  zipkin:
    tracing:
      endpoint: http://zipkin:9411/api/v2/spans
  tracing:
    sampling:
      probability: 1.0