apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-config
  labels:
    app: {{ .Release.Name }}
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 10s

    scrape_configs:
      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']
          
      - job_name: 'product_service'
        metrics_path: '/product/actuator/prometheus'
        static_configs:
          - targets: ['product-service:8093']
            labels:
              application: 'Product Service Application'
           
      - job_name: 'order_service'
        metrics_path: '/order/actuator/prometheus'
        static_configs:
          - targets: ['order-service:8092']
            labels:
              application: 'Order Service Application'
      
      - job_name: 'inventory_service'
        metrics_path: '/inventory/actuator/prometheus'
        static_configs:
          - targets: ['inventory-service:8094']
            labels:
              application: 'inventory Service Application'
