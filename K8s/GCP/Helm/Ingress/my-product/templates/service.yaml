apiVersion: v1
kind: Service
metadata:
  name: product-service
  labels:
    app : product-service
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.port }}
      protocol: TCP
      name: product-service
  selector:
    app : product-service
